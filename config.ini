[DEFAULT]
flow_timeout = 1200
max_packets_per_flow = 10000
queue_size = 100000
log_level = INFO
separate_l2_l3 = false

[PROTOCOLS]
enable_tcp = true
enable_udp = true
enable_quic = true
enable_dhcp = true
enable_stp = true
enable_cdp = true
enable_icmp = true
enable_lldp = true
enable_vtp = true
enable_dtp = true
enable_dns = true
enable_isl = true
enable_ssh = true
enable_ftp = true

[FEATURES]
extract_statistical = true
extract_timing = true
extract_size = true
extract_protocol_specific = true

[OUTPUT]
output_dir = Results
log_file = log.txt
csv_file = features.csv